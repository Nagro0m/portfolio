# Réglages du site (rarement à modifier).
# Tes infos perso (bio, compétences, parcours) sont dans _data/profil.yml
# Tes projets sont dans le dossier _projets/

title: Morgan Fourquet — Développeur gameplay
description: Développeur jeu vidéo en formation à Montpellier, spécialisé gameplay (GPE) et 3C sur Unreal Engine (C++) et Unity (C#).
url: "https://morganfourquet.com"
baseurl: ""
lang: fr

collections:
  projets:
    output: true
    permalink: /projets/:name/

defaults:
  - scope:
      type: projets
    values:
      layout: projet

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
