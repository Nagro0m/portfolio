title: Morgan Fourquet — Gameplay Programmer
url: "https://nagro0m.github.io"
baseurl: "/portfolio"

collections:
  projets:
    output: true

defaults:
  - scope:
      path: "_projets"
      type: projets
    values:
      layout: projet
      lang: en
      permalink: /projects/:name/
  - scope:
      path: "_projets/fr"
      type: projets
    values:
      layout: projet
      lang: fr
      permalink: /fr/projets/:name/
  - scope:
      path: ""
      type: pages
    values:
      lang: en

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
