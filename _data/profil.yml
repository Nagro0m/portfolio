# Section "À propos"
a_propos:
  - >-
    J'aime les systèmes qui se sentent bien manette en main : un personnage qui répond
    au quart de tour, une caméra qui ne gêne jamais, une interaction claire.
    C'est ce que je travaille sur chaque projet, en Unreal Engine (C++ et Blueprint)
    comme en Unity (C#).
  - >-
    Je code proprement et de façon modulaire, pour que le reste de l'équipe puisse
    s'appuyer sur mes systèmes. J'écris aussi des outils en Python pour accélérer
    le travail de l'équipe, et j'ai déjà mené plusieurs équipes de programmeurs.

